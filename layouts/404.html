{{ define "main" }}
<section class="hero" style="padding-bottom: 5rem;">
  <div class="container" style="grid-template-columns: 1fr; text-align: left;">
    <div>
      <span class="kicker">404</span>
      <h1>Page not found</h1>
      <p class="lede">Whatever you were looking for isn't here anymore, or never was. Let's get you back on track.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="{{ "/" | relURL }}">Home</a>
        <a class="btn btn-outline" href="{{ "/schedule/" | relURL }}">Schedule</a>
        <a class="btn btn-outline" href="{{ "/posts/" | relURL }}">Posts</a>
      </div>
    </div>
  </div>
</section>
{{ end }}
