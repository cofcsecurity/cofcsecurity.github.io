<header class="site-header">
  <div class="container">
    <a class="brand" href="{{ "/" | relURL }}">
      <img src="{{ "img/logo-hor-w.png" | relURL }}" alt="College of Charleston Cybersecurity Club" height="40">
    </a>
    <div class="header-controls">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span class="theme-toggle-sun">{{ partial "icon.html" "sun" }}</span>
        <span class="theme-toggle-moon">{{ partial "icon.html" "moon" }}</span>
      </button>
      <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="main-nav">
        {{ partial "icon.html" "menu" }} Menu
      </button>
    </div>
    <nav class="main-nav" id="main-nav">
      <ul>
        {{ range .Site.Menus.main }}
        {{ $url := .URL | relURL }}
        {{ $active := or (eq $.RelPermalink $url) (and (ne $url "/") (strings.HasPrefix $.RelPermalink $url)) }}
        <li><a href="{{ $url }}"{{ if $active }} class="active"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
<script>
  (function () {
    var toggle = document.getElementById('nav-toggle');
    var nav = document.getElementById('main-nav');
    function setOpen(open) {
      nav.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', String(open));
    }
    toggle.addEventListener('click', function (e) {
      e.stopPropagation();
      setOpen(!nav.classList.contains('open'));
    });
    document.addEventListener('click', function (e) {
      if (nav.classList.contains('open') && !nav.contains(e.target)) {
        setOpen(false);
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && nav.classList.contains('open')) {
        setOpen(false);
        toggle.focus();
      }
    });
  })();
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var root = document.documentElement;
    var current = root.getAttribute('data-theme');
    var isLight = current ? current === 'light' : !window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next = isLight ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });
</script>
