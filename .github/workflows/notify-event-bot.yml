name: Notify Discord Event Bot

on:
  push:
    branches:
      - master
    paths:
      - data/schedule.yaml

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Skips quietly (instead of failing) until DISCORD_BOT_DISPATCH_TOKEN is added as a repo secret.
    if: ${{ secrets.DISCORD_BOT_DISPATCH_TOKEN != '' }}
    steps:
      - name: Trigger discord-event-bot sync
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.DISCORD_BOT_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cofcsecurity/discord-event-bot/dispatches \
            -d '{"event_type":"schedule-updated"}'
