- semester: "Fall semester"
  items:
    - name: "National Cyber League (NCL)"
      url: "https://nationalcyberleague.org/"
      cost: "Paid — $35 ($45 late)"
      format: "CTF · individual & team games"
      difficulty: "Easy–Hard"
      description: "Includes the practice gym, practice game, individual game, and team games. Access lasts a few months."
    - name: "Dragos CTF"
      url: "https://www.dragos.com/"
      cost: "Free"
      format: "CTF · individual game"
      difficulty: "Medium–Hard"
      description: "An industrial-control-systems-flavored CTF run by Dragos."
    - name: "Hivestorm"
      url: "https://www.hivestorm.org/"
      cost: "Free"
      format: "Vulnerability securing · team of 4"
      difficulty: "Medium"
      description: "Teams of 4 secure 4 VM instances — 2 Windows, 2 Linux."
    - name: IRSeC
      url: "https://irsec.club/"
      cost: "Free"
      format: "Red vs Blue Incident Response"
      difficulty: "Medium"
      description: "RITSEC's beginner Red vs. Blue Incident Response competition"
- semester: "Spring semester"
  items:
    - name: "PicoCTF"
      url: "https://picoctf.org/"
      cost: "Free"
      format: "CTF · individual game"
      difficulty: "Easy–Hard"
      description: "24/7 free access to the pico gym."
    - name: "HTB Cyber Apocalypse"
      url: "https://www.hackthebox.com/events/"
      cost: "Free"
      format: "CTF · team game"
      difficulty: "Medium–Hard"
      description: "Hack The Box's seasonal team CTF event."
    - name: "SECCDC"
      url: "https://cyberflorida.org/seccdc/"
      cost: "Free — limited space"
      format: "Team based · team of 7, shadow team of 4"
      difficulty: "Large competition"
      description: "Qualifier for [CCDC](https://www.nationalccdc.org/). Simulates a real network under attack by a red team."
    - name: "PCDC"
      url: "https://pcdc-sc.com/"
      cost: "Free — limited space"
      format: "Team based"
      difficulty: "Large competition"
      description: "Simulates a real network under attack by a red team."
